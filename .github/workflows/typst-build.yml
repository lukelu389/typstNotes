name: Build and commit Typst PDFs

on:
  push:
    branches: [main]
    paths-ignore:
      - "pdf/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile all Typst notes
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' source; do
            relative="${source#notes/}"
            output="pdf/notes/${relative%.typ}.pdf"

            echo "Compiling ${source} -> ${output}"
            mkdir -p "$(dirname "${output}")"
            typst compile --root . "${source}" "${output}"
          done < <(find notes -type f -name '*.typ' -print0)

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pdf/

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update generated PDFs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
