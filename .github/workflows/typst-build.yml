name: Build Typst PDFs

on:
  push:
    branches: [main]
    paths-ignore:
      - "pdf/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile all Typst notes
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' source; do
            relative="${source#notes/}"
            output="pdf/notes/${relative%.typ}.pdf"

            echo "Compiling ${source} -> ${output}"
            mkdir -p "$(dirname "${output}")"
            typst compile --root . "${source}" "${output}"
          done < <(find notes -type f -name '*.typ' -print0)

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: typst-pdfs
          path: pdf/
          if-no-files-found: error
