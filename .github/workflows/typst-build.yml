name: Build Changed Typst PDFs

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "pdf/**"
  pull_request:
    paths-ignore:
      - "pdf/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Find and compile changed Typst files
        id: compile
        shell: bash
        run: |
          set -eux

          # Determine which commits to compare
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          HEAD="${{ github.sha }}"

          echo "Comparing:"
          echo "BASE=$BASE"
          echo "HEAD=$HEAD"

          # Find only added or modified .typ files under notes/
          mapfile -t files < <(
            git diff --name-only \
              --diff-filter=AM \
              "$BASE" "$HEAD" \
              -- 'notes/**/*.typ'
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed Typst files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          for f in "${files[@]}"; do
            echo "Compiling $f"

            rel="${f#notes/}"
            out="pdf/${rel%.typ}.pdf"

            mkdir -p "$(dirname "$out")"

            typst compile --root . "$f" "$out"
          done

      - name: Commit generated PDFs
        if: steps.compile.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pdf/

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Update generated PDFs"
            git push
          fi